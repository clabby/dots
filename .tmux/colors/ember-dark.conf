# Ember colors
# https://github.com/ember-theme/nvim/blob/main/lua/ember/palette.lua
thm_fg="#d8d0c0"
thm_fg_muted="#b0a898"
thm_gray="#706C61"
thm_coral="#E08060"

# Transparent statusbar background
set -g status-style "bg=default"
set -g status-interval 1

# Pane borders
set -gq pane-border-style "fg=${thm_gray}"
set -gq pane-active-border-style "fg=${thm_coral}"

# Status bars
set -gq status-left-length 40
set -gq status-left " #[fg=$thm_coral]󰘧:#[fg=$thm_fg_muted]#S #[fg=$thm_fg]|"
set -gq status-right "#{?window_zoomed_flag,#[fg=$thm_coral]  ,}#[fg=$thm_coral] #[fg=$thm_fg_muted]%H:%M:%S "

# Window Status
setw -gq window-status-format " #[fg=$thm_fg] #[fg=$thm_fg]#I:#[fg=$thm_fg_muted]#W"
setw -gq window-status-current-format " #[fg=$thm_coral] #[fg=$thm_fg]#I:#[fg=$thm_fg_muted]#W"
