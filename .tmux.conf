# Make my neovim themes work >_>
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Change leader key
unbind C-b
set -g prefix C-e

# Vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel

# Bind splits
unbind "%"
bind-key "|" split-window -h
unbind '"'
bind-key "\\" split-window -v

unbind s
bind-key s display-popup -w 40 -h 15 -E "~/.tmux/fzf-sessions.sh"
unbind w
bind-key w display-popup -w 40 -h 15 -E "~/.tmux/fzf-windows.sh"

unbind r
bind-key r source-file ~/.tmux.conf

set -g mouse on
set -g set-titles on

# Renumber windows when one is removed
set -g renumber-windows on

# -------
# Plugins
# -------

set -g @plugin "tmux-plugins/tpm"

## Theming
set -g @plugin "erikw/tmux-dark-notify"
set -g @dark-notify-theme-path-light '$HOME/.tmux/colors/ember-light.conf'
set -g @dark-notify-theme-path-dark '$HOME/.tmux/colors/ember-dark.conf'

run "~/.tmux/plugins/tpm/tpm"

if-shell "test -e ~/.local/state/tmux/tmux-dark-notify-theme.conf" \
     "source-file ~/.local/state/tmux/tmux-dark-notify-theme.conf"
